<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">MetaClean feature mind map</title><desc id="desc">Six branches: clean files, writing editor, desktop experience, engineering, privacy, and boundaries. Cleanup is not full anonymization, detector evasion, or malware scanning.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183c2e;font-size:16px}.heading{font-size:22px;font-weight:600}.name{font-size:19px;font-weight:600}.small{font-size:13px;fill:#52685f}.branch{fill:#edf8f1;stroke:#b8cfc3;stroke-width:1.3}.line{fill:none;stroke:#8bab9a;stroke-width:2}</style>
<rect width="1100" height="660" fill="#fff" rx="12"/><text x="40" y="45" class="heading">MetaClean / feature mind map</text><text x="40" y="70" class="small">What the application does, how it is built, and where its scope ends</text>
<g class="line"><path d="M450 322C400 322 415 183 365 183"/><path d="M450 330H365"/><path d="M450 338C400 338 415 500 365 500"/><path d="M650 322C700 322 685 183 735 183"/><path d="M650 330H735"/><path d="M650 338C700 338 685 500 735 500"/></g>
<rect x="450" y="290" width="200" height="80" rx="40" fill="#102c26"/><text x="550" y="339" text-anchor="middle" style="fill:#b5f2d1;font-size:25px;font-weight:600">MetaClean</text>
<g><rect x="55" y="110" width="310" height="142" rx="10" class="branch"/><text x="78" y="142" class="name">Clean files</text><text x="78" y="172">PDF and Office properties</text><text x="78" y="199">Stray invisible characters</text><text x="78" y="226">New desktop output copies</text>
<rect x="55" y="275" width="310" height="125" rx="10" class="branch"/><text x="78" y="307" class="name">Writing editor</text><text x="78" y="337">Offline polish / local Ollama</text><text x="78" y="364">Review, revise, export</text><text x="78" y="385" class="small">Supported DOCX formatting retained</text>
<rect x="55" y="425" width="310" height="142" rx="10" class="branch"/><text x="78" y="457" class="name">Desktop experience</text><text x="78" y="487">Drag-and-drop file queue</text><text x="78" y="514">Metadata inspection</text><text x="78" y="541">Background workers</text>
<rect x="735" y="110" width="310" height="142" rx="10" class="branch"/><text x="758" y="142" class="name">Engineering</text><text x="758" y="172">Python / Qt</text><text x="758" y="199">28 automated tests</text><text x="758" y="226">Windows CI / portable package</text>
<rect x="735" y="275" width="310" height="125" rx="10" class="branch"/><text x="758" y="307" class="name">Privacy</text><text x="758" y="337">Local processing by default</text><text x="758" y="364">No telemetry or saved history</text><text x="758" y="385" class="small">Optional model requests use loopback</text>
<rect x="735" y="425" width="310" height="142" rx="10" class="branch"/><text x="758" y="457" class="name">Boundaries</text><text x="758" y="487">Not a complete anonymizer</text><text x="758" y="514">No AI-detector guarantees</text><text x="758" y="541">Not a malware scanner</text></g>
<text x="550" y="620" text-anchor="middle" class="small">Preview build: use trusted documents; parser resource isolation and legacy CLI output handling need hardening.</text>
</svg>
