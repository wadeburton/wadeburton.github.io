<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">MetaClean UML class and module diagram</title><desc id="desc">MainWindow inherits QMainWindow and contains DropZone, which inherits QFrame. It uses Worker, which inherits QThread. MainWindow depends on the DesktopCore and Writing modules. Writing also depends on DesktopCore. DesktopCore produces Scan; Writing loads Document and produces Revision.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#527366" stroke-width="1.4"/></marker><marker id="inherit" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M1 1L12 6L1 11Z" fill="white" stroke="#527366" stroke-width="1.3"/></marker><marker id="diamond" markerWidth="15" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M1 5L7 1L13 5L7 9Z" fill="#527366"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183c2e;font-size:15px}.heading{font-size:22px;font-weight:600}.name{font-size:18px;font-weight:600}.small{font-size:13px;fill:#52685f}.box{fill:#fff;stroke:#b8cfc3;stroke-width:1.3}.module{fill:#edf8f1;stroke:#a6c9b4;stroke-width:1.3}.line{fill:none;stroke:#527366;stroke-width:1.5}.dep{stroke-dasharray:6 5}</style>
<rect width="1100" height="660" rx="12" fill="#fff"/>
<text x="40" y="45" class="heading">MetaClean / implementation structure</text><text x="40" y="70" class="small">Simplified UML · classes plus Python modules</text>
