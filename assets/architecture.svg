<g><rect class="box" x="135" y="105" width="220" height="44"/><text x="245" y="133" text-anchor="middle" class="name">QFrame</text><rect class="box" x="430" y="105" width="240" height="44"/><text x="550" y="133" text-anchor="middle" class="name">QMainWindow</text><rect class="box" x="765" y="105" width="220" height="44"/><text x="875" y="133" text-anchor="middle" class="name">QThread</text>
<rect class="box" x="135" y="205" width="220" height="78"/><text x="245" y="235" class="name" text-anchor="middle">DropZone</text><text x="245" y="260" class="small" text-anchor="middle">Local file drop signals</text>
<rect class="module" x="430" y="205" width="240" height="78"/><text x="550" y="235" class="name" text-anchor="middle">MainWindow</text><text x="550" y="260" class="small" text-anchor="middle">Queue + editor + job state</text>
<rect class="box" x="765" y="205" width="220" height="78"/><text x="875" y="235" class="name" text-anchor="middle">Worker</text><text x="875" y="260" class="small" text-anchor="middle">Background callable + signals</text>
<rect class="module" x="180" y="360" width="310" height="125"/><text x="335" y="382" text-anchor="middle" class="small">«module»</text><text x="335" y="408" text-anchor="middle" class="name">desktop_core.py</text><path d="M180 420H490" stroke="#a6c9b4"/><text x="200" y="446">inspect_file() · clean_file()</text><text x="200" y="472">validate_input() · publish_copy()</text>
<rect class="module" x="610" y="360" width="310" height="125"/><text x="765" y="382" text-anchor="middle" class="small">«module»</text><text x="765" y="408" text-anchor="middle" class="name">writing.py</text><path d="M610 420H920" stroke="#a6c9b4"/><text x="630" y="446">load_document() · polish_text()</text><text x="630" y="472">rewrite_local() · save_word_revision()</text>
<rect class="box" x="225" y="548" width="220" height="62"/><text x="335" y="574" text-anchor="middle" class="name">Scan</text><text x="335" y="595" text-anchor="middle" class="small">Inspection result</text>
<rect class="box" x="560" y="548" width="200" height="62"/><text x="660" y="574" text-anchor="middle" class="name">Document</text><text x="660" y="595" text-anchor="middle" class="small">Imported text + source</text>
<rect class="box" x="800" y="548" width="200" height="62"/><text x="900" y="574" text-anchor="middle" class="name">Revision</text><text x="900" y="595" text-anchor="middle" class="small">Revised text + notes</text>
</g><text x="550" y="415" text-anchor="middle" class="small">uses</text><text x="717" y="232" text-anchor="middle" class="small">starts</text><text x="40" y="640" class="small">Hollow triangle: inheritance · Diamond: composition · Dashed arrow: dependency · Qt framework members omitted</text>
